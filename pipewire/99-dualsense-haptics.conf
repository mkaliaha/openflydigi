# Fake DualSense audio endpoint, impersonating the real device as closely as a
# virtual node can: identical node name, description and topology properties.
#
# Known limitation: winepulse resolves device identity through the Linux sysfs
# path and looks the result up in setupapi to get a container id. A null sink
# has no kernel device behind it, so Wine assigns ROOT\MEDIA\N rather than
# USB\VID_054C&PID_0CE6. These properties test whether anything matches on the
# name/description instead.
context.objects = [
    { factory = adapter
      args = {
        factory.name       = support.null-audio-sink
        node.name          = "alsa_output.usb-Sony_Interactive_Entertainment_DualSense_Wireless_Controller-00.Direct__Direct__sink"
        node.description   = "DualSense wireless controller (PS5) Direct DualSense Wireless Controller"
        node.nick          = "Wireless Controller"
        media.class        = Audio/Sink
        audio.position     = [ FL FR RL RR ]
        object.linger      = true
        node.props = {
            device.bus            = "usb"
            device.vendor.id      = 0x054c
            device.product.id     = 0x0ce6
            device.vendor.name    = "Sony Corp."
            device.product.name   = "DualSense wireless controller (PS5)"
            device.serial         = "Sony_Interactive_Entertainment_DualSense_Wireless_Controller"
            device.bus_path       = "pci-0000:00:14.0-usb-0:4:1.0"
            device.bus-id         = "usb-Sony_Interactive_Entertainment_DualSense_Wireless_Controller-00"
            sysfs.path            = "/devices/pci0000:00/0000:00:14.0/usb3/3-4/3-4:1.0/sound/card1"
            api.alsa.card.name    = "DualSense Wireless Controller"
            api.alsa.card.longname = "Sony Interactive Entertainment DualSense Wireless Controller"
            alsa.card_name        = "DualSense Wireless Controller"
            alsa.components       = "USB054c:0ce6"
            alsa.driver_name      = "snd_usb_audio"
            device.icon_name      = "audio-headset"
            device.form_factor    = "headset"
            device.class          = "sound"
            device.api            = "alsa"
        }
      }
    }
]
