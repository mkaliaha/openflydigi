# Fake DualSense audio endpoint, for testing whether games that drive haptics
# through the controller's USB audio device will accept an unassociated sink.
# A real DualSense exposes 4 output channels: 2 haptic actuators + 2 speaker.
context.objects = [
    { factory = adapter
      args = {
        factory.name     = support.null-audio-sink
        node.name        = "dualsense_haptics"
        node.description = "Wireless Controller"
        media.class      = Audio/Sink
        audio.position   = [ FL FR RL RR ]
        object.linger    = true
        monitor.channel-volumes = true
      }
    }
]
